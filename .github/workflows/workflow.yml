name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3  # Step to check out the code from your repository
    - name: Set up Python 3.x
      uses: actions/setup-python@v3  # Setting up Python
      with:
        python-version: "3.10"  # Specify the version of Python you need
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip  # Upgrading pip
        pip install flake8 pytest  # Installing dependencies, update as needed
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi  # If you have a requirements.txt file
    - name: Run tests with pytest
      run: |
        pytest  # Run tests using pytest
